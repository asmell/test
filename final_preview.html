<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ファイナルステージ プレビュー</title>
<style>
:root{--ink:#3a2e4a;--blue:#4dc3ff;--yellow:#ffd93d;--green:#6dd96d;--red:#e0566b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;background:#111;color:var(--ink);user-select:none;}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#1b2230;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;}
.hidden{display:none!important;}
/* 廊下（パース） */
.hall{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#2a3550 0 62%,#5b4630 62% 64%,#3a2c1c 64% 100%);}
.hall .wallL{position:absolute;inset:0;background:#26324c;clip-path:polygon(0 0,30% 20%,30% 64%,0 100%);}
.hall .wallR{position:absolute;inset:0;background:#26324c;clip-path:polygon(100% 0,70% 20%,70% 64%,100% 100%);}
.hall .ceil{position:absolute;inset:0;background:#1c2740;clip-path:polygon(0 0,100% 0,70% 20%,30% 20%);}
.hall .back{position:absolute;inset:0;background:#33405e;clip-path:polygon(30% 20%,70% 20%,70% 64%,30% 64%);}
.hall .floorline{position:absolute;left:0;right:0;top:62%;height:3px;background:#7a5e3a;}
/* 大きな出口ドア（奥） */
.exit{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:84px;height:150px;background:linear-gradient(180deg,#6b4a2c,#4a3018);border:5px solid #2f1f12;border-radius:6px 6px 0 0;z-index:1;transition:transform 1s ease;transform-origin:left center;}
.exit::after{content:"";position:absolute;right:10px;top:50%;width:9px;height:9px;border-radius:50%;background:var(--yellow);}
.exitLight{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:84px;height:150px;background:radial-gradient(circle at 50% 50%,#fff,#fff3b0);opacity:0;z-index:0;border-radius:6px 6px 0 0;}
/* キャラ */
.prin{position:absolute;right:14%;bottom:16%;width:140px;z-index:3;transition:transform .8s ease,opacity .8s ease;}
.prin img{width:100%;display:block;}
.prin.step{transform:translateX(60px);opacity:.0;}
.player{position:absolute;left:9%;bottom:16%;width:88px;z-index:3;}
.player img{width:100%;display:block;}
/* HUD：校長のガード */
.guard{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:#fff;border-radius:999px;padding:7px 16px;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.guard b{color:var(--red);}
.titleline{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:6;background:#7c5fd6;color:#fff;font-weight:900;font-size:14px;padding:5px 14px;border-radius:999px;box-shadow:0 3px 0 #5a3fb0;white-space:nowrap;}
/* セリフ＆問題 */
.dialog{position:absolute;left:12px;right:12px;bottom:150px;z-index:7;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25);font-weight:900;font-size:16px;color:var(--ink);min-height:54px;line-height:1.5;}
.dialog .who{color:#9c5b2a;font-size:13px;}
.qbox{position:absolute;left:12px;right:12px;bottom:18px;z-index:7;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qbtn{border:none;cursor:pointer;border-radius:12px;padding:12px 8px;font-size:16px;font-weight:900;color:#06435e;background:linear-gradient(180deg,#7fd6ff,var(--blue));box-shadow:0 4px 0 #1c91c9;}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1c91c9;}
.qbtn.ng{background:#ffd5d5;color:#b53030;box-shadow:0 4px 0 #d99;}
.qbtn.ok{background:linear-gradient(180deg,#9be79b,var(--green));color:#0a4d1a;box-shadow:0 4px 0 #2f9b46;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none;}
.flash.on{animation:fl 1s ease forwards;}
@keyframes fl{0%{opacity:0;}50%{opacity:1;}100%{opacity:0;}}
.stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:10;font-size:34px;font-weight:900;color:#e23b3b;white-space:nowrap;padding:8px 18px;border:5px solid #e23b3b;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 6px 14px rgba(0,0,0,.3);}
.stamp.show{animation:st .6s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes st{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-16deg);opacity:0;}60%{transform:translate(-50%,-50%) scale(.9) rotate(-10deg);opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-10deg);opacity:1;}}
.note{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:#888;font-size:11px;z-index:20;}
.shake{animation:sh .35s;}@keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
</style></head><body><div id="app">

const QS=[
 {q:"理科：水素（すいそ）は？",a:["単体","化合物"],c:0,line:"ふむ…水素は1種類の原子だけ。単体だ。"},
 {q:"英語：「つくえ」は？",a:["DESK","DOG","DOOR","DISK"],c:0,line:"つくえ…DESK。よろしい。"},
 {q:"社会：大阪は何地方？",a:["関東地方","近畿地方","九州地方","東北地方"],c:1,line:"大阪は近畿地方。地理もできるな。"},
 {q:"数学：(-3) × 4 = ?",a:["-12","12","-7","7"],c:0,line:"負×正は負。-12。正解だ。"},
 {q:"国語：氵 ＋ 毎 ＝ ?",a:["海","池","湖","河"],c:0,line:"さんずいに毎で「海」。見事…！"},
];
let qi=0, guard=5;
const dialog=document.getElementById('dialog'), qbox=document.getElementById('qbox'), guardEl=document.getElementById('guard');
function render(){
  const it=QS[qi];
  dialog.innerHTML='<span class="who">校長</span> 第'+(qi+1)+'問<br>'+it.q;
  qbox.innerHTML=it.a.map((t,i)=>'<button class="qbtn" data-i="'+i+'">'+t+'</button>').join('');
  qbox.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b));
}
function answer(i,btn){
  const it=QS[qi];
  if(i===it.c){
    btn.classList.add('ok');
    guard--; guardEl.textContent=guard;
    dialog.innerHTML='<span class="who">校長</span><br>'+it.line;
    qbox.querySelectorAll('.qbtn').forEach(b=>b.disabled=true);
    setTimeout(()=>{ qi++; if(qi>=QS.length){ win(); } else { render(); } }, 1100);
  } else {
    btn.classList.add('ng'); document.getElementById('app').classList.add('shake');
    setTimeout(()=>document.getElementById('app').classList.remove('shake'),350);
    dialog.innerHTML='<span class="who">校長</span><br>あまい！ もう一度考えたまえ。';
  }
}
function win(){
  dialog.innerHTML='<span class="who">校長</span><br>ほう…全問正解とは。見事だ。行きたまえ！';
  qbox.innerHTML='';
  document.getElementById('prin').classList.add('step');           // 校長が道をあける
  setTimeout(()=>{ document.getElementById('exit').style.transform='translateX(-50%) perspective(500px) rotateY(-78deg)'; document.getElementById('exitLight').style.opacity='1'; }, 700); // 出口が開く
  setTimeout(()=>{ document.getElementById('flash').classList.add('on'); }, 1700);
  setTimeout(()=>{ document.getElementById('stamp').classList.add('show'); dialog.innerHTML='<span class="who"></span>🎉 校長を倒した！！！ 脱出成功！！！'; }, 2100);
}
render();
</script></body></html>
